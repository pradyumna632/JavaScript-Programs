<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening a Window using click</title>
</head>
<body>

    <input type="button" value="Open Window" onclick="winOpen()">

    <script>

       function winOpen(){
        window.open("https://www.w3schools.com/jsref/jsref_obj_regexp.asp", "google", "left=200, top=200, width=800, height=500")
       }

    </script>
    
</body>
</html>
