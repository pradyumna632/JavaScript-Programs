<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus a Window</title>
</head>
<body>

    <input type="button" value="Open Window" onclick="winOpen()">

    <script>

       function winOpen(){
        let win = window.open("https://www.google.com/", "w3schools", "left=200, top=200, width=800, height=500")
        win.focus();

        }

    </script>
    
</body>
</html>
