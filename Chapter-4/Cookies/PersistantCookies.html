<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Cookies</title>
</head>
<body>

    <label for="username">Username</label>
    <input type="text" id="username" name="username">
    <br><br>
    <label for="password">Password</label>
    <input type="text" id="password" name="password">
    <br><br>
    <input type="button" value="Create Cookies" onclick="createCookie()">
    

<script>
   
    function createCookie(){
        user = document.getElementById("username").value;
        pass = document.getElementById("password").value;
    
        document.cookie = "username=" + user + ";expires= Thu, 27 Oct 2024 12:00:00 UTC";
        document.cookie = "password=" + pass + ";expires= Thu, 27 Oct 2024 12:00:00 UTC";
    
        alert(document.cookie);
    }


</script>

</body>
</html>
