<!DOCTYPE html>
<html>
<head>
    <title>3x3 Grid Frame Layout</title>
</head>    
<!-- Created a frameset with 3 rows -->
    <frameset rows="33%, 33%, 33%">
        <!-- For each row, we have created a frameset with 3 columns -->
        <frameset cols="33%, 33%, 33%">
            <frame src="index1.html" name="frame1">
            <frame src="" name="frame2">
            <frame src="" name="frame3">
        </frameset>
        <frameset cols="33%, 33%, 33%">
            <frame src="" name="frame1">
            <frame src="index2.html" name="frame2">
            <frame src="" name="frame3">
        </frameset>
        <frameset cols="33%, 33%, 33%">
            <frame src="" name="frame1">
            <frame src="" name="frame2">
            <frame src="index3.html" name="frame3">
        </frameset>
    </frameset>
</html>
